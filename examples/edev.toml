# Example .edev.toml -- copy to your project root as .edev.toml and edit.
#
# edev discovers this file by walking from the current directory upward,
# stopping at the nearest git root. Use --config <path> to override.
# Every field below shows the default value; omit fields you don't need.
# CLI flags always take precedence over file values.


# -- App launch settings (shared by all subcommands) ---------------------

[app]

# Full argv to start the app. Edev supplies the private automation endpoint.
# You can pass a command after `--` on any subcommand to replace this value.
command = [
  "cargo", "run", "--locked",
  "-p", "myapp",
  "--bin", "myapp",
]

# macOS presentation while an automation client is connected. Background keeps
# covered windows renderable without showing the app in the Dock or taking focus;
# foreground preserves the app's ordinary presentation for manual sessions.
# Attachment without a connected client does not change presentation.
# presentation = "background"

# Deadline for normal app closure before Edev reports forced cleanup and kills
# the managed process group.
# shutdown_grace_secs = 30

# Working directory for the app process. Relative paths resolve from the
# directory containing this file.
# cwd = "."

# Extra environment variables injected into the app process.
# env = { RUST_LOG = "info" }


# -- MCP proxy settings (edev mcp) --------------------------------------

[mcp]

# Emit verbose launcher lifecycle logs to stderr.
# verbose = false

# Shut down an abandoned launcher if no MCP client initializes within this
# many seconds. After a client attaches, stdio EOF or process shutdown controls
# the launcher lifetime, and `status` reports the idle guard as suspended.
# idle_shutdown_after_secs = 1200


# -- Smoketest settings (edev smoke) ------------------------------------

[smoke]

# Directory containing .luau smoketest scripts. Relative paths resolve
# from the directory containing this file.
# suite_dir = "smoketest"

# Stop the suite after the first failure.
# fail_fast = false

# Fail a script when it leaves egui identity diagnostics undismissed.
# Disable this only when the suite must retain expected warnings in its output
# or failure bundle without changing script status.
# fail_on_egui_diagnostics = true

# Failure bundle output directory used by `edev smoke --bundle`.
# Relative paths resolve from the directory containing this file.
# bundle_dir = "tmp/edev-bundles"

# Wall-clock deadline for the entire suite, in seconds.
# Repeated smoke runs share this whole-invocation deadline; use
# `edev smoke --suite-timeout-secs N` for long `--repeat` / `--until-fail`
# sessions.
# suite_timeout_secs = 600

# Per-script timeout, in seconds.
# `edev eval` uses this as its default script timeout unless `--script-timeout-secs`
# is passed.
# script_timeout_secs = 60

# Typed arguments passed to every script. Values are auto-typed:
# true/false -> bool, integers -> int, decimals -> float, else string.
# `edev smoke` and `edev eval` both use these defaults. CLI --arg flags are
# merged on top of these.
# args = { theme = "dark", count = 5 }


# -- Recording smoke runs (edev record) ---------------------------------

# Recording has no config defaults. Use `edev record OUTFILE ...` with the
# smoke flags above, for example:
#   edev record tmp/spacecurve-smoke.mov --only '*layout*'
#
# Recording is macOS-only, uses native ScreenCaptureKit direct recording rather
# than an external recorder, requires Screen Recording permission for the
# terminal or process running edev, and writes one H.264 video-only `.mov` for
# the whole smoke invocation. The runtime and Luau APIs stay portable and do not
# expose native recording details.
