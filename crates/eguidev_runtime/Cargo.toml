serde.workspace = true
serde_json.workspace = true
tmcp = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
eframe.workspace = true
tmcp = { workspace = true, features = ["testutils"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10"
core-graphics = "0.25"
dispatch2 = "0.3.1"
foreign-types = "0.5"
objc2 = "0.6"
